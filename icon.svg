<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="squircleClip">
      <rect x="8" y="8" width="496" height="496" rx="124" />
    </clipPath>

    <!-- Rich Dark Glass Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131c31" />
      <stop offset="55%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Aurora Glows -->
    <radialGradient id="auroraCyan" cx="25%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.48" />
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auroraIndigo" cx="80%" cy="78%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.42" />
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Floor Gradient -->
    <linearGradient id="glassFloor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.16" />
    </linearGradient>

    <!-- Neon Rim Gradient -->
    <linearGradient id="neonRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Wall Gradients -->
    <linearGradient id="wallLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24344f" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96" />
    </linearGradient>

    <linearGradient id="wallRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b4c6b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.96" />
    </linearGradient>

    <!-- Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="1" />
      <stop offset="45%" stop-color="#0ea5e9" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Glass Border -->
    <linearGradient id="borderStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.4" />
    </linearGradient>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <!-- Abgerundetes Squircle-Icon (transparente Ecken für rundes Favicon) -->
  <g clip-path="url(#squircleClip)">
    <rect x="8" y="8" width="496" height="496" rx="124" fill="url(#bgGrad)" />
    <rect x="8" y="8" width="496" height="496" rx="124" fill="url(#auroraCyan)" />
    <rect x="8" y="8" width="496" height="496" rx="124" fill="url(#auroraIndigo)" />

    <!-- Top Glass Sheen Arc -->
    <path d="M 8 135 C 8 60, 60 8, 135 8 L 377 8 C 452 8, 504 60, 504 135 C 370 185, 142 185, 8 135 Z" fill="#ffffff" opacity="0.06" />

    <!-- Ground Shadow Plane -->
    <ellipse cx="256" cy="392" rx="150" ry="44" fill="#000000" opacity="0.55" filter="url(#softGlow)" />

    <!-- Isometric 3D Floorplan Base -->
    <polygon points="256,368 108,282 256,196 404,282" fill="url(#glassFloor)" stroke="url(#neonRim)" stroke-width="5" stroke-linejoin="round" filter="url(#glowFilter)" />

    <!-- 3D Isometric Walls (Back Left & Back Right) -->
    <polygon points="108,282 256,196 256,120 108,206" fill="url(#wallLeft)" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.75" stroke-linejoin="round" />
    <polygon points="256,196 404,282 404,206 256,120" fill="url(#wallRight)" stroke="#a78bfa" stroke-width="3" stroke-opacity="0.75" stroke-linejoin="round" />

    <!-- Crisp Wall Top Highlight -->
    <polyline points="108,206 256,120 404,206" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92" />

    <!-- Architectural Room Division -->
    <line x1="256" y1="196" x2="256" y2="368" stroke="#67e8f9" stroke-width="3" stroke-dasharray="8,6" stroke-opacity="0.55" />
    <line x1="182" y1="239" x2="330" y2="325" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="6,6" stroke-opacity="0.45" />

    <!-- Smart Home Nodes -->
    <circle cx="192" cy="290" r="16" fill="#0284c7" opacity="0.35" filter="url(#glowFilter)" />
    <circle cx="192" cy="290" r="7" fill="#67e8f9" />

    <circle cx="320" cy="272" r="16" fill="#7c3aed" opacity="0.35" filter="url(#glowFilter)" />
    <circle cx="320" cy="272" r="7" fill="#d8b4fe" />

    <!-- Central Floating Smart Core -->
    <ellipse cx="256" cy="262" rx="44" ry="24" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.55" />
    <circle cx="256" cy="248" r="34" fill="url(#coreGlow)" filter="url(#glowFilter)" />
    <circle cx="256" cy="248" r="20" fill="#ffffff" />
    <circle cx="251" cy="243" r="6" fill="#bae6fd" />
  </g>

  <!-- Outer Rounded Glass Bezel -->
  <rect x="8" y="8" width="496" height="496" rx="124" fill="none" stroke="url(#borderStroke)" stroke-width="5" />
</svg>
